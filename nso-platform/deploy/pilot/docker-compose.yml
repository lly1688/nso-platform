name: nso-pilot

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/pilot/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NSO_HTTP_PORT:-80}:80"
      - "${NSO_HTTPS_PORT:-443}:443"
    volumes:
      - "${NSO_TLS_CERT_DIR:?Set NSO_TLS_CERT_DIR to the directory containing tls.crt and tls.key}:/etc/nginx/certs:ro"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: deploy/pilot/Dockerfile.api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8081
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      NSO_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      NSO_DATASOURCE_USERNAME: ${MYSQL_USER:?Set MYSQL_USER}
      NSO_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      NSO_REDIS_HOST: redis
      NSO_REDIS_PORT: 6379
      NSO_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      NSO_REDIS_DATABASE: 0
      NSO_JWT_ISSUER: ${NSO_JWT_ISSUER:-nso-pilot}
      NSO_JWT_SECRET: ${NSO_JWT_SECRET:?Set NSO_JWT_SECRET to at least 32 characters}
      NSO_MINIO_ENDPOINT: http://minio:9000
      NSO_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      NSO_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      NSO_MINIO_BUCKET: ${NSO_MINIO_BUCKET:-nso-files}
      NSO_FLYWAY_ENABLED: "true"
      NSO_BOOTSTRAP_ENABLED: "false"
      NSO_DEMO_ENABLED: "false"
      NSO_API_DOCS_ENABLED: "false"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - nso_api_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 45s

  mysql:
    image: ${NSO_MYSQL_IMAGE:?Set NSO_MYSQL_IMAGE to a verified digest reference}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --slow-query-log=1
      - --long-query-time=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
    volumes:
      - nso_mysql_data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '5'
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: ${NSO_REDIS_IMAGE:?Set NSO_REDIS_IMAGE to a verified digest reference}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --save 900 1 --save 300 10 --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - nso_redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: ${NSO_MINIO_IMAGE:?Set NSO_MINIO_IMAGE to a verified digest reference}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - nso_minio_data:/data
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio-init:
    image: ${NSO_MINIO_MC_IMAGE:?Set NSO_MINIO_MC_IMAGE to a verified digest reference}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      NSO_MINIO_BUCKET: ${NSO_MINIO_BUCKET:-nso-files}
    entrypoint: >-
      /bin/sh -c "mc alias set nso http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing nso/$$NSO_MINIO_BUCKET"
    networks:
      - backend

networks:
  edge:
  backend:

volumes:
  nso_api_logs:
  nso_mysql_data:
  nso_redis_data:
  nso_minio_data:
