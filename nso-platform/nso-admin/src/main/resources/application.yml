# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Spring核心配置
spring:
  application:
    name: nso-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: ${NSO_UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${NSO_UPLOAD_MAX_REQUEST_SIZE:220MB}
  # 数据库迁移配置
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # 通知模板刻意包含 ${...} 运行时变量。
    # 它们并非数据库迁移配置占位符。
    placeholder-replacement: false
  # Quartz定时任务配置
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.jobStore.isClustered: ${NSO_QUARTZ_CLUSTERED:false}
      org.quartz.jobStore.clusterCheckinInterval: 20000
      org.quartz.scheduler.instanceId: AUTO

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.nso.system.domain,com.nso.business
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 应用监控与管理端点配置
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# NSO平台自定义配置
nso:
  # 安全与JWT令牌配置
  security:
    issuer: ${NSO_JWT_ISSUER:nso-platform}
    secret: ${NSO_JWT_SECRET:}
    access-token-minutes: ${NSO_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${NSO_REFRESH_TOKEN_DAYS:7}
    password-recovery-rate-limit-per-minute: ${NSO_PASSWORD_RECOVERY_RATE_LIMIT_PER_MINUTE:10}
    guest-support-rate-limit-per-minute: ${NSO_GUEST_SUPPORT_RATE_LIMIT_PER_MINUTE:30}
  # API文档配置
  api-docs:
    enabled: ${NSO_API_DOCS_ENABLED:false}
  # 对象存储配置
  storage:
    bucket: ${NSO_MINIO_BUCKET:nso-files}
  # 启动引导配置
  bootstrap:
    enabled: ${NSO_BOOTSTRAP_ENABLED:false}
    admin-username: ${NSO_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${NSO_BOOTSTRAP_ADMIN_PASSWORD:}
  # 演示模式配置
  demo:
    enabled: ${NSO_DEMO_ENABLED:false}
    default-password: ${NSO_DEMO_DEFAULT_PASSWORD:}
  # 工作流配置
  workflow:
    document:
      # V1.0 将文档发布视为技术负责人的显式发布动作。
      # 需要独立审批人的部署环境可将此项设为 false。
      allow-self-publish: ${NSO_WORKFLOW_DOCUMENT_ALLOW_SELF_PUBLISH:true}
