name: nso-platform

services:
  mysql:
    image: mysql:8.4
    container_name: nso-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nso_root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nso_platform}
      MYSQL_USER: ${MYSQL_USER:-nso_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nso_app_change_me}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - nso_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # 使用不可变版本标签。请勿改为 `latest` 或仅主版本号的标签。
    image: ${NSO_REDIS_IMAGE:-redis:8.6.1-alpine}
    container_name: nso-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - nso_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nso-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nso_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nso_minio_change_me}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - nso_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: nso-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nso_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nso_minio_change_me}
      NSO_MINIO_BUCKET: ${NSO_MINIO_BUCKET:-nso-files}
    entrypoint: >-
      /bin/sh -c "mc alias set nso http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing nso/$$NSO_MINIO_BUCKET"

volumes:
  nso_mysql_data:
  nso_redis_data:
  nso_minio_data:
