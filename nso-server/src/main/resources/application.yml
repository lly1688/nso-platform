server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nso-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${NSO_DATASOURCE_URL:jdbc:mysql://localhost:3306/nso_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${NSO_DATASOURCE_USERNAME:nso_app}
    password: ${NSO_DATASOURCE_PASSWORD:nso_app_change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${NSO_REDIS_HOST:localhost}
      port: ${NSO_REDIS_PORT:6379}
      database: ${NSO_REDIS_DATABASE:0}
      password: ${NSO_REDIS_PASSWORD:}

  flyway:
    enabled: ${NSO_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    path: logs
  level:
    root: info
    com.nso: debug

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.nso.system.domain,com.nso.modules.*.domain
  configuration:
    map-underscore-to-camel-case: true
