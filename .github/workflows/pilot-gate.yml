name: NSO pilot gate
on:
  push:
    branches: [ main, master, 'codex/**' ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nso-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nso-platform/nso-web/package-lock.json
      - run: mvn -B clean test
      - run: npm ci && npm run build
        working-directory: nso-platform/nso-web
      - run: ./scripts/verify-migrations.ps1
        shell: pwsh
      - run: docker compose --env-file deploy/pilot/.env.example -f deploy/pilot/docker-compose.yml config
      - run: npm audit --audit-level=high
        working-directory: nso-platform/nso-web
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: |
          docker build -f nso-platform/deploy/pilot/Dockerfile.api -t nso-api:scan nso-platform
          docker build -f nso-platform/deploy/pilot/Dockerfile.web -t nso-web:scan nso-platform
      - uses: aquasecurity/setup-trivy@v0.2.3
        with:
          cache: true
      - name: Scan dependencies and all deployed images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force scan-reports | Out-Null
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output scan-reports/dependencies.json nso-platform
          $failed = $LASTEXITCODE -ne 0
          $images = @('nso-api:scan', 'nso-web:scan')
          $images += Get-Content nso-platform/deploy/pilot/.env.example | Where-Object { $_ -match '^NSO_(MYSQL|REDIS|MINIO|MINIO_MC)_IMAGE=' } | ForEach-Object { ($_ -split '=', 2)[1] }
          $index = 0
          foreach ($image in $images) {
            trivy image --severity HIGH,CRITICAL --exit-code 1 --format json --output "scan-reports/image-$index.json" $image
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            $index++
          }
          if ($failed) { throw 'Vulnerabilities or scanner failures block release. Inspect scan-reports.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: scan-reports/
